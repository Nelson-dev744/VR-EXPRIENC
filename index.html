<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Class work</title>
</head>
<body>
    <article class="flex gap-3 flex-col md:flex-row">
        <section class="bg-[url('./assets/Woman-VR.png')] md:h-200 w-100 md:w-1/2 bg-no-repeat bg-cover bg-center flex flex-col justify-end p-10 gap-4">
            <h5 class="py-2 px-5 bg-white w-fit rounded-full">Just Launched</h5>
            <h1 class="text-white text-xl md:text-4xl">Immersive VR Exprience</h1>
            <p class="text-white font-medium">Lorem ipsum dolor sit, amet consectetur adipisicing 
            <br class="text-white">elit. Hic, facere!</p>
            <div>
                <button class="text-white font-medium px-5 py-3 bg-purple-500 rounded-lg">Discover Collection</button>
            </div>
        </section>
        <section>
            <div class="mx-auto flex h-100 w-345 max-w-[384px] flex-col items-center overflow-hidden rounded-[14px] bg-[#f0efff] pt-[27px] mb-3">
                <span class="mb-[15px] rounded-md bg-white px-[14px] py-[7px] text-[15px] font-normal leading-[18px] text-[#50576a]">
                    Just Launched
                </span>
                <h2 class="mb-[32px] text-center text-[17px] font-normal leading-[20px] text-[#4d566a]">
                    Style That Moves With You
                </h2>
                <img src="./assets/Smart watch.jpg"alt="Black smartwatch with a light gray strap" class="h-80 w-80 object-contain"/>
            </div>
            <div class="mx-auto flex h-100 w-345 max-w-[384px] flex-col items-center overflow-hidden rounded-[14px] bg-[#f0efff] pt-[27px]">
                <span class="mb-[15px] rounded-md bg-white px-[14px] py-[7px] text-[15px] font-normal leading-[18px] text-[#50576a]">
                    Tablet
                </span>
                <h2 class="mb-[32px] text-center text-[17px] font-normal leading-[20px] text-[#4d566a]">
                    A Bigger Screen for Bigger Ideas
                </h2>
                <img src="./assets/Tablet.jpg"alt="Black smartwatch with a light gray strap" class="h-80 w-80 object-contain"/>
            </div>
        </section>
        <section>
            <div class="mx-auto flex h-203 w-345 max-w-[384px] flex-col items-center overflow-hidden rounded-[14px] bg-[#f0efff] pt-[27px] mb-3">
                <span class="mb-[15px] rounded-md bg-white px-[14px] py-[7px] text-[15px] font-normal leading-[18px] text-[#50576a]">
                    I-phone
                </span>
                <h2 class="mb-[32px] text-center text-[17px] font-normal leading-[20px] text-[#4d566a]">
                    Power and Performance Designed for 
                <br>Everyday Use
                </h2>
                <img src="./assets/I-phone (2).jpg"alt="Black smartwatch with a light gray strap" class="h-80 mt-30 w-80">
            </div>
        </section>

</html>
